name: McvpnPlugin
version: 0.1.0
main: dev.mcvpn.plugin.McvpnPlugin
api-version: '1.20'
author: mcvpn
description: >
  Minecraft-tunnel server side: receives tunnel-channel plugin messages from
  the mcvpn client and forwards the payload to a local TCP target.

commands:
  mcvpn:
    description: Manage mcvpn admin accounts and per-user tunnel credentials. Console-only.
    usage: >
      /mcvpn admin create <username> <password> | admin list | user list |
      user create <label> | user revoke <keyId>
    # No player should ever see this command exists (not even an op) -- see
    # McvpnCommand's class doc for the full rationale. `mcvpn.console` is
    # `default: false` below (nobody has it, including ops) purely so
    # Bukkit's own tab-completion/`/help` filtering hides it from every
    # player. `default: false` returns false unconditionally, even for
    # console (which Bukkit otherwise treats as "op") -- PluginCommand's own
    # permission check runs before onCommand() ever sees the request, so
    # McvpnPlugin#onEnable must explicitly attach this permission to the
    # console sender or console gets rejected at that check, before the
    # command code's own console-only enforcement ever runs.
    permission: mcvpn.console
    permission-message: 'Unknown command. Type "/help" for help.'
  list:
    description: >
      Overrides vanilla /list to exclude active tunnel connections, the same
      way they're already excluded from the tab list and server-list ping.
    usage: /list

permissions:
  mcvpn.console:
    description: >
      Intentionally never granted to any player (see the mcvpn command
      entry above) -- exists only so Bukkit hides /mcvpn from tab-completion
      and /help for players. Console access is granted explicitly via an
      attachment in McvpnPlugin#onEnable, since default: false blocks
      console too (see the comment on the mcvpn command above).
    default: false
