name: Release builds

# Builds every packaged artifact -- macOS .dmg (universal), Windows .exe +
# .msi, Linux .deb + .rpm, Android .apk -- across a runner matrix.
#
# Why CI and not a single local script: Flutter does not support
# cross-compiling desktop targets. `flutter build windows`/`flutter build
# linux` refuse outright unless run on that OS -- confirmed by trying them
# from a macOS dev machine, not assumed. macOS artifacts *can* be built
# locally (see scripts/build.sh); Windows/Linux genuinely cannot be,
# short of owning a machine of that OS.
#
# tun-engine (tun-engine) is the one piece that's OS-independent: it's
# pure Go with no cgo, so it cross-compiles from anywhere -- built once on
# Linux and handed to both the windows and linux jobs.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FLUTTER_VERSION: "3.44.8"
  GO_VERSION: "1.23"
  APP_VERSION: "1.0.0"

jobs:
  engine:
    name: tun-engine (cross-compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cross-compile for every desktop target
        working-directory: tun-engine
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o dist/tun-engine_linux_amd64       .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -o dist/tun-engine_linux_arm64       .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/tun-engine_windows_amd64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o dist/tun-engine_windows_arm64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: tun-engine
          path: tun-engine/dist/*

  macos:
    name: macOS (.dmg, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build macos --release
        working-directory: app
      - name: Package .dmg
        run: |
          brew install create-dmg
          create-dmg \
            --volname "mcvpn" \
            --window-size 600 400 \
            --app-drop-link 450 200 \
            "mcvpn-macos.dmg" \
            "app/build/macos/Build/Products/Release/mcvpn.app" || true
          # create-dmg exits non-zero on some harmless AppleScript Finder
          # warnings even after writing a valid dmg; verify the file landed.
          test -f mcvpn-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: mcvpn-macos.dmg

  windows:
    name: Windows (.exe + .msi)
    needs: [engine]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - uses: actions/download-artifact@v4
        with:
          name: tun-engine
          path: engine-dist
      - name: Bundle tun-engine next to the app executable
        shell: pwsh
        run: |
          Copy-Item engine-dist\tun-engine_windows_amd64.exe `
            app\build\windows\x64\runner\Release\tun-engine.exe
      - name: Install Inno Setup and WiX
        run: |
          choco install innosetup -y
          dotnet tool install --global wix
      - name: Build .exe installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ env.APP_VERSION }} `
            scripts\windows\installer.iss
      - name: Generate WiX authoring from the release folder
        shell: pwsh
        run: |
          .\scripts\windows\generate-wxs.ps1 `
            -SourceDir app\build\windows\x64\runner\Release `
            -Version ${{ env.APP_VERSION }} `
            -OutFile installer.wxs
      - name: Build .msi (WiX)
        shell: pwsh
        run: wix build installer.wxs -out mcvpn-windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            scripts/windows/Output/*.exe
            mcvpn-windows.msi

  linux:
    name: Linux (.deb + .rpm)
    needs: [engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev rpm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build linux --release
        working-directory: app
      - uses: actions/download-artifact@v4
        with:
          name: tun-engine
          path: engine-dist
      - name: Bundle tun-engine next to the app executable
        run: |
          cp engine-dist/tun-engine_linux_amd64 \
            app/build/linux/x64/release/bundle/tun-engine
          chmod +x app/build/linux/x64/release/bundle/tun-engine
      - name: Install fpm
        run: sudo gem install --no-document fpm
      - name: Package .deb and .rpm
        run: |
          fpm -s dir -t deb -n mcvpn -v ${{ env.APP_VERSION }} \
            --prefix /opt/mcvpn -C app/build/linux/x64/release/bundle \
            --after-install scripts/linux/postinstall.sh .
          fpm -s dir -t rpm -n mcvpn -v ${{ env.APP_VERSION }} \
            --prefix /opt/mcvpn -C app/build/linux/x64/release/bundle \
            --after-install scripts/linux/postinstall.sh .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.deb
            *.rpm

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install the NDK (for the tun2socks JNI libraries)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
      - name: Cross-compile tun2socks JNI libraries (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          TOOLCHAIN="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT="app/android/app/src/main/jniLibs"
          mkdir -p "$OUT/arm64-v8a" "$OUT/armeabi-v7a" "$OUT/x86_64"
          cd tun-engine
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$TOOLCHAIN/aarch64-linux-android24-clang" \
            go build -buildmode=c-shared -o "../../$OUT/arm64-v8a/libtun2socks.so" ./android
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC="$TOOLCHAIN/armv7a-linux-androideabi24-clang" \
            go build -buildmode=c-shared -o "../../$OUT/armeabi-v7a/libtun2socks.so" ./android
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$TOOLCHAIN/x86_64-linux-android24-clang" \
            go build -buildmode=c-shared -o "../../$OUT/x86_64/libtun2socks.so" ./android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
